<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 600' width='400' height='600'>
    <defs>
      <linearGradient id='canGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
        <stop offset='0%' stop-color='#064e3b'/>
        <stop offset='25%' stop-color='#047857'/>
        <stop offset='55%' stop-color='#10b981'/>
        <stop offset='85%' stop-color='#047857'/>
        <stop offset='100%' stop-color='#064e3b'/>
      </linearGradient>
      <linearGradient id='metalRim' x1='0%' y1='0%' x2='100%' y2='0%'>
        <stop offset='0%' stop-color='#64748b'/>
        <stop offset='50%' stop-color='#f8fafc'/>
        <stop offset='100%' stop-color='#475569'/>
      </linearGradient>
      <linearGradient id='highlight' x1='0%' y1='0%' x2='100%' y2='0%'>
        <stop offset='0%' stop-color='#ffffff' stop-opacity='0.4'/>
        <stop offset='100%' stop-color='#ffffff' stop-opacity='0'/>
      </linearGradient>
      <filter id='shadow' x='-10%' y='-5%' width='120%' height='115%'>
        <feDropShadow dx='0' dy='15' stdDeviation='18' flood-color='#000000' flood-opacity='0.6'/>
      </filter>
    </defs>
    <!-- Background backdrop for photography card look -->
    <rect width='400' height='600' rx='28' fill='#0b1120'/>
    <circle cx='200' cy='300' r='180' fill='#047857' opacity='0.12' filter='blur(30px)'/>

    <!-- Can Graphic -->
    <g filter='url(#shadow)'>
      <!-- Top Rim Lip -->
      <ellipse cx='200' cy='95' rx='95' ry='24' fill='url(#metalRim)'/>
      <ellipse cx='200' cy='93' rx='80' ry='18' fill='#1e293b'/>
      <!-- Pull tab -->
      <ellipse cx='200' cy='93' rx='28' ry='8' fill='#cbd5e1'/>
      <circle cx='200' cy='93' r='4' fill='#0f172a'/>

      <!-- Can Cylinder Body -->
      <path d='M 105 98 L 105 480 Q 105 525 200 525 Q 295 525 295 480 L 295 98 Z' fill='url(#canGrad)'/>

      <!-- Specular Highlight streak -->
      <path d='M 145 99 L 155 515 Q 168 522 178 523 L 168 99 Z' fill='url(#highlight)'/>

      <!-- Custom Art & Logos -->
      
  <circle cx='200' cy='280' r='55' fill='#fef08a' fill-opacity='0.15' stroke='#facc15' stroke-width='3'/>
  <circle cx='200' cy='280' r='45' fill='#064e3b'/>
  <circle cx='190' cy='275' r='14' fill='#dc2626'/>
  <circle cx='210' cy='275' r='14' fill='#dc2626'/>
  <circle cx='190' cy='275' r='6' fill='#fef08a'/>
  <circle cx='210' cy='275' r='6' fill='#fef08a'/>
  <circle cx='190' cy='275' r='3' fill='#000000'/>
  <circle cx='210' cy='275' r='3' fill='#000000'/>
  <path d='M 175 255 Q 200 240 225 255' stroke='#10b981' stroke-width='5' fill='none'/>
  <text x='200' y='365' font-family='Impact, sans-serif' font-size='32' fill='#f8fafc' text-anchor='middle' letter-spacing='1'>GUARANÁ</text>
  <text x='200' y='392' font-family='system-ui, sans-serif' font-size='15' font-weight='800' fill='#facc15' text-anchor='middle'>ANTARCTICA</text>
  <text x='200' y='425' font-family='system-ui, sans-serif' font-size='13' font-weight='700' fill='#ffffff' opacity='0.8' text-anchor='middle'>100 ANOS • 1921-2021</text>


      <!-- Bottom Rim Lip -->
      <ellipse cx='200' cy='485' rx='95' ry='22' fill='url(#metalRim)' opacity='0.85'/>
      <path d='M 115 485 Q 200 508 285 485 L 285 498 Q 200 520 115 498 Z' fill='#334155'/>
    </g>

    <!-- Volume badge -->
    <rect x='160' y='548' width='80' height='26' rx='13' fill='#1e293b' stroke='#334155'/>
    <text x='200' y='566' font-family='system-ui, sans-serif' font-size='13' font-weight='700' fill='#94a3b8' text-anchor='middle'>350 ml</text>

    <rect x='110' y='28' width='180' height='28' rx='14' fill='#eab308' fill-opacity='0.18' stroke='#eab308'/>
    <text x='200' y='47' font-family='system-ui, sans-serif' font-size='12' font-weight='800' fill='#fde047' text-anchor='middle'>★ Comemorativa 100 Anos</text>
  </svg>