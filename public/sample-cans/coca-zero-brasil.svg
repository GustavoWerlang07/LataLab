<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 600' width='400' height='600'>
    <defs>
      <linearGradient id='canGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
        <stop offset='0%' stop-color='#0a0a0a'/>
        <stop offset='25%' stop-color='#171717'/>
        <stop offset='55%' stop-color='#262626'/>
        <stop offset='85%' stop-color='#171717'/>
        <stop offset='100%' stop-color='#0a0a0a'/>
      </linearGradient>
      <linearGradient id='metalRim' x1='0%' y1='0%' x2='100%' y2='0%'>
        <stop offset='0%' stop-color='#64748b'/>
        <stop offset='50%' stop-color='#f8fafc'/>
        <stop offset='100%' stop-color='#475569'/>
      </linearGradient>
      <linearGradient id='highlight' x1='0%' y1='0%' x2='100%' y2='0%'>
        <stop offset='0%' stop-color='#ffffff' stop-opacity='0.4'/>
        <stop offset='100%' stop-color='#ffffff' stop-opacity='0'/>
      </linearGradient>
      <filter id='shadow' x='-10%' y='-5%' width='120%' height='115%'>
        <feDropShadow dx='0' dy='15' stdDeviation='18' flood-color='#000000' flood-opacity='0.6'/>
      </filter>
    </defs>
    <!-- Background backdrop for photography card look -->
    <rect width='400' height='600' rx='28' fill='#0b1120'/>
    <circle cx='200' cy='300' r='180' fill='#171717' opacity='0.12' filter='blur(30px)'/>

    <!-- Can Graphic -->
    <g filter='url(#shadow)'>
      <!-- Top Rim Lip -->
      <ellipse cx='200' cy='95' rx='95' ry='24' fill='url(#metalRim)'/>
      <ellipse cx='200' cy='93' rx='80' ry='18' fill='#1e293b'/>
      <!-- Pull tab -->
      <ellipse cx='200' cy='93' rx='28' ry='8' fill='#cbd5e1'/>
      <circle cx='200' cy='93' r='4' fill='#0f172a'/>

      <!-- Can Cylinder Body -->
      <path d='M 105 98 L 105 480 Q 105 525 200 525 Q 295 525 295 480 L 295 98 Z' fill='url(#canGrad)'/>

      <!-- Specular Highlight streak -->
      <path d='M 145 99 L 155 515 Q 168 522 178 523 L 168 99 Z' fill='url(#highlight)'/>

      <!-- Custom Art & Logos -->
      
  <g transform='translate(200, 290) rotate(-90)'>
    <text x='0' y='18' font-family='Georgia, serif' font-size='52' font-style='italic' font-weight='900' fill='#ffffff' text-anchor='middle' letter-spacing='-1'>Coca-Cola</text>
    <path d='M -130 38 Q 0 -15 130 38' stroke='#10b981' stroke-width='6' fill='none' stroke-linecap='round'/>
  </g>
  <rect x='125' y='400' width='150' height='30' rx='6' fill='#e11d48'/>
  <text x='200' y='421' font-family='system-ui, sans-serif' font-size='14' font-weight='900' fill='#ffffff' text-anchor='middle'>SEM AÇÚCAR</text>
  <circle cx='180' cy='455' r='12' fill='#10b981'/>
  <polygon points='180,446 190,455 180,464 170,455' fill='#facc15'/>
  <text x='215' y='460' font-family='system-ui, sans-serif' font-size='12' font-weight='800' fill='#f8fafc'>EDIÇÃO BRASIL</text>


      <!-- Bottom Rim Lip -->
      <ellipse cx='200' cy='485' rx='95' ry='22' fill='url(#metalRim)' opacity='0.85'/>
      <path d='M 115 485 Q 200 508 285 485 L 285 498 Q 200 520 115 498 Z' fill='#334155'/>
    </g>

    <!-- Volume badge -->
    <rect x='160' y='548' width='80' height='26' rx='13' fill='#1e293b' stroke='#334155'/>
    <text x='200' y='566' font-family='system-ui, sans-serif' font-size='13' font-weight='700' fill='#94a3b8' text-anchor='middle'>350 ml</text>

    <rect x='110' y='28' width='180' height='28' rx='14' fill='#eab308' fill-opacity='0.18' stroke='#eab308'/>
    <text x='200' y='47' font-family='system-ui, sans-serif' font-size='12' font-weight='800' fill='#fde047' text-anchor='middle'>★ Edição Especial</text>
  </svg>