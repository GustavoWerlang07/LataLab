<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="canGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="25%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="85%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- Glowing vault ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2563eb" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Can Body -->
  <!-- Top Rim -->
  <ellipse cx="256" cy="140" rx="90" ry="24" fill="url(#metalRim)"/>
  <ellipse cx="256" cy="138" rx="76" ry="17" fill="#0f172a"/>
  <!-- Pull Tab -->
  <ellipse cx="256" cy="138" rx="28" ry="8" fill="#94a3b8"/>
  <circle cx="256" cy="138" r="4" fill="#0f172a"/>

  <!-- Can Main Cylinder -->
  <path d="M 166 142 L 166 352 Q 166 388 256 388 Q 346 388 346 352 L 346 142 Z" fill="url(#canGradient)" filter="url(#glow)"/>

  <!-- Can Highlighting & Vault Shield Overlay -->
  <!-- Vertical Specular Light Streak -->
  <path d="M 210 144 L 218 376 Q 232 384 242 385 L 236 145 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Vault Lock / Diamond Star Graphic on Can -->
  <g transform="translate(256, 260)">
    <!-- Hexagonal Vault Core -->
    <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="#0f172a" stroke="url(#accentGlow)" stroke-width="5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="0" cy="0" r="7" fill="#10b981"/>
    <!-- Vault ticks -->
    <line x1="0" y1="-34" x2="0" y2="-24" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="34" x2="0" y2="24" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="0" x2="-20" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="0" x2="20" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Rim -->
  <ellipse cx="256" cy="354" rx="90" ry="24" fill="url(#metalRim)" opacity="0.9"/>
  <path d="M 176 354 Q 256 374 336 354 L 336 364 Q 256 384 176 364 Z" fill="#475569"/>

  <!-- Minimalist Text: LATALAB -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="7" fill="#f8fafc" text-anchor="middle">LATALAB</text>
</svg>
